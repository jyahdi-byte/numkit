name: build

on: [push, pull_request]

jobs:
  cpu-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU targets
        run: make all
      - name: Run CPU tests
        run: |
          ./test_solvers.exe
          ./test_mt.exe
          ./test_rb_mt.exe
          ./test_omega_auto.exe
          ./test_grid.exe
          ./test_jacobi.exe
          ./test_grid3d.exe
          ./test_jacobi3d.exe
          ./test_slice_grid3d.exe

  cuda-compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.15
        id: cuda-toolkit
        with:
          cuda: '12.4.0'

      # NOTE: GitHub-hosted runners have no NVIDIA GPU. This step proves
      # the CUDA code compiles (catches syntax/type errors on every push)
      # but CANNOT execute the kernels or verify assertions in
      # tests/cuda/grid_transfer_test.cu, tests/cuda/jacobi_validate.cu,
      # tests/cuda/bench_gpu.cu, tests/cuda/jacobi_tiled_validate.cu, or
      # tests/cuda/cuda_solvers_validate_3d.cu. Actual test
      # runs happen locally on a GPU (Colab) before trusting a commit.
      - name: Compile CUDA tests (build-check only, not run)
        run: |
          nvcc -I include tests/cuda/grid_transfer_test.cu -o grid_transfer_test.exe
          nvcc -I include tests/cuda/jacobi_validate.cu -o jacobi_validate.exe
          nvcc -I include -O3 -arch=sm_75 tests/cuda/bench_gpu.cu -o bench_gpu
          nvcc -I include tests/cuda/jacobi_tiled_validate.cu -o jacobi_tiled_validate.exe
          nvcc -I include -O3 -arch=sm_75 tests/cuda/bench_tiled_sweep.cu -o bench_tiled_sweep
          nvcc -std=c++20 -I include tests/cuda/jacobi_convergence.cu -o jacobi_convergence
          nvcc -std=c++20 -I include tests/cuda/gauss_seidel_rb_validate.cu -o gauss_seidel_rb_validate.exe
          nvcc -std=c++20 -I include tests/cuda/sor_rb_validate.cu -o sor_rb_validate.exe
          nvcc -std=c++20 -I include tests/cuda/cuda_solvers_validate_3d.cu -o cuda_solvers_validate_3d.exe